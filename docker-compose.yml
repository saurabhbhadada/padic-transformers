version: '3.8'

services:
  padic-dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: padic-transformers:latest
    container_name: padic-transformers-dev

    # GPU configuration - only GPUs 5 and 6
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0', '1']
              capabilities: [gpu]

    # Mount project directory
    volumes:
      - .:/workspace/padic-transformers
      - ./datasets:/workspace/padic-transformers/datasets
      - ./checkpoints:/workspace/padic-transformers/checkpoints
      - ./results:/workspace/padic-transformers/results

    # Expose ports
    ports:
      - "8888:8888"  # Jupyter
      - "6006:6006"  # TensorBoard
      - "8080:8080"  # Additional services

    # Environment variables
    # Note: CUDA_VISIBLE_DEVICES removed - set it per run instead
    environment:
      - WANDB_API_KEY=${WANDB_API_KEY}
      - HF_TOKEN=${HF_TOKEN}
      - PYTHONPATH=/workspace/padic-transformers/src

    # Keep container running
    stdin_open: true
    tty: true

    # Shared memory size (important for DataLoader workers)
    shm_size: '32gb'

    # Network mode
    network_mode: "host"

    # Restart policy
    restart: unless-stopped
